name: Update AUR packages

on:
  schedule:
    # 每 6 小时一次（UTC），配合 upstream 发布节奏
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建工具并建普通用户（makepkg 拒绝 root）
        run: |
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed base-devel git curl jq python github-cli sudo
          useradd -m builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"

      - name: 准备 builder 环境（git 署名 + AUR SSH）
        run: |
          mkdir -p /home/builder/.ssh
          umask 077
          printf '%s\n' "${{ secrets.AUR_SSH_KEY }}" > /home/builder/.ssh/aur_key
          chown -R builder:builder /home/builder/.ssh
          cat > /home/builder/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
          EOF
          runuser -u builder -- git config --global user.name "Become-ILLUSORY"
          runuser -u builder -- git config --global user.email "becomeillusory@gmail.com"

      - name: 检查并更新所有包
        run: runuser -u builder -- bash update-all.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 汇总
        run: |
          echo "### 本次自动更新完成" >> "$GITHUB_STEP_SUMMARY"