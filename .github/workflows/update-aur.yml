name: Update AUR packages

on:
  schedule:
    # 每天一次（UTC），覆盖 AUR 更新 + oplus-connect 编译发布
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      force-rebuild-oplus:
        description: '强制重建 oplus-connect（忽略 BUILD_SHA 对比）'
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建工具并建普通用户（makepkg 拒绝 root）
        run: |
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed base-devel git curl jq python github-cli sudo openssh
          useradd -m builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"

      - name: 准备 builder 环境（git 署名 + AUR SSH）
        run: |
          mkdir -p /home/builder/.ssh
          umask 077
          printf '%s\n' "${{ secrets.AUR_SSH_KEY }}" > /home/builder/.ssh/aur_key
          chown -R builder:builder /home/builder/.ssh
          cat > /home/builder/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
          EOF
          runuser -u builder -- git config --global user.name "Become-ILLUSORY"
          runuser -u builder -- git config --global user.email "becomeillusory@gmail.com"

      - name: 检查并更新所有包
        run: runuser -u builder -- env GIT_SSH_COMMAND='ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /home/builder/.ssh/aur_key' bash update-all.sh > update.log 2>&1 || { tail -50 update.log; exit 1; }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 汇总
        run: |
          # grep/sed 对 UTF-8 中文的 [^ ] 匹配依赖 locale，显式固定，避免解析挂掉
          export LC_ALL=C.UTF-8
          cat update.log
          echo "## 本次自动更新" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "运行时间：$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # update-all.sh 末尾输出的 "===== 汇总 =====" 段：逐行 | 分隔：包名|动作|版本|备注
          if grep -q '^===== 汇总 =====' update.log; then
            echo "| 包 | 动作 | 版本 | 备注 |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
            sed -n '/^===== 汇总 =====$/,/^全部完成/p' update.log \
              | grep -E '^  [^ ]' \
              | sed -E 's/^  ([^ ]+) +([^ ]+) +([^ ]+) +(.*)$/| \1 | \2 | \3 | \4 |/' \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_update-all.sh 未输出汇总段（脚本异常终止？）_，详情见下方完整日志" >> "$GITHUB_STEP_SUMMARY"
          fi

  build-oplus:
    # oplus-connect：源码构建包（无 tag/release），每次上游 main 有新 commit 就
    # 在 CI 里用 cachyos-v3（x86-64-v3 优化包）重编译出 .pkg.tar.zst 并发布到
    # 本仓库 GitHub Release（tag: oplus-connect-latest）。跳过判断用 release body 里
    # 的 BUILD_SHA 对比。以后源码构建类包一律走本 job 的 cachyos-v3 模式。
    runs-on: ubuntu-latest
    container:
      image: cachyos/cachyos-v3:latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: 查询上游最新 commit
        id: upstream
        run: |
          sha="$(git ls-remote https://github.com/YuKongA/oplus-connect.git refs/heads/main | awk '{print $1}')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "!! 无法获取上游 sha: $sha"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "上游 main = ${sha:0:12}"

      - name: 安装 gh（对比步骤也要用，先装轻量工具）
        run: |
          pacman -Syy --noconfirm
          pacman -S --noconfirm --needed github-cli git sudo ca-certificates

      - name: 对比上次已构建版本
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last="$(gh release view oplus-connect-latest -R "$GITHUB_REPOSITORY" --json body --jq '.body' 2>/dev/null | sed -n 's/^BUILD_SHA: \([0-9a-f]\{40\}\)$/\1/p' || true)"
          echo "last=$last" >> "$GITHUB_OUTPUT"
          if [[ "${{ inputs.force-rebuild-oplus }}" == "true" ]]; then
            echo "手动强制重建"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [[ -n "$last" && "$last" == "${{ steps.upstream.outputs.sha }}" ]]; then
            echo "上游无新 commit，跳过构建"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 检出上游源码（固定 commit）
        if: steps.last.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: YuKongA/oplus-connect
          ref: ${{ steps.upstream.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 安装构建依赖并建普通用户（makepkg 拒绝 root）
        if: steps.last.outputs.skip != 'true'
        run: |
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed git sudo base-devel github-cli rust zstd
          mapfile -t deps < <(bash -c 'source PKGBUILD && printf "%s\n" "${depends[@]}" "${makedepends[@]}"' | grep -xE '^[[:alnum:]@._+\-]+$' | sort -u)
          ((${#deps[@]} > 0)) || { echo "!! 没解析到任何依赖"; exit 1; }
          pacman -S --noconfirm --needed "${deps[@]}"
          useradd -m builder
          chown -R builder:builder "${GITHUB_WORKSPACE}"

      - name: 恢复 cargo 缓存（加速后续增量编译）
        id: cargocache
        if: steps.last.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
            src/target
          key: ${{ runner.os }}-cargo-target-${{ steps.upstream.outputs.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      - name: 修复缓存属主（restore 是 root，builder 要写）
        if: steps.last.outputs.skip != 'true'
        run: |
          install -d -o builder -g builder /home/builder/.cargo 2>/dev/null || true
          chown -R builder:builder /home/builder/.cargo src 2>/dev/null || true

      - name: 构建 .pkg.tar.zst
        if: steps.last.outputs.skip != 'true'
        run: |
          commit="${{ steps.upstream.outputs.sha }}"
          # 必须锁定 target-cpu=x86-64-v3：cachyos-v3 容器默认按 runner CPU 编译
          # （GitHub Xeon 带 AVX-512），产物在无 AVX-512 的 AMD CPU 上直接 SIGILL
          # （ILL_ILLOPN, vmovups %zmm）。v3 = avx2/fma 已覆盖本机 6800H。
          runuser -u builder -- env HOME=/home/builder CARGO_INCREMENTAL=0 SOURCE_DATE_EPOCH=1 \
            RUSTFLAGS="-C target-cpu=x86-64-v3" \
            OPLUS_CONNECT_SOURCE_URL="file://$PWD#commit=$commit" \
            makepkg --nocheck --noconfirm --nosign
          sha256sum *.pkg.tar.zst

      - name: 上传构建产物（发布失败也留包）
        if: steps.last.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oplus-connect-${{ steps.upstream.outputs.sha }}
          path: "*.pkg.tar.zst"
          if-no-files-found: error

      - name: 保存 cargo 缓存
        if: steps.last.outputs.skip != 'true' && steps.cargocache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
            src/target
          key: ${{ runner.os }}-cargo-target-${{ steps.upstream.outputs.sha }}

      - name: 安装测试（装不上则失败，不发布）
        if: steps.last.outputs.skip != 'true'
        run: |
          pkg=$(ls *.pkg.tar.zst | head -1)
          [[ -n "$pkg" ]] || { echo "!! 未找到 pkg.tar.zst"; exit 1; }
          pacman -U --noconfirm "$pkg"
          pacman -Q oplus-connect

      - name: 发布到 GitHub Release
        if: steps.last.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # checkout 目录被 chown 给了 builder，root 跑 gh 内部 git 会触发
          # safe.directory 检查（dubious ownership）——容器一次性，全局放行
          git config --global --add safe.directory '*'
          # 当前 git remote 是上游 YuKongA/oplus-connect，gh 默认发到那里会 403；
          # 必须显式 -R 指回本仓库（GITHUB_REPOSITORY 是 GitHub 注入的固定变量）
          repo="$GITHUB_REPOSITORY"
          commit="${{ steps.upstream.outputs.sha }}"
          pkg=$(ls *.pkg.tar.zst | head -1)
          [[ -n "$pkg" ]] || { echo "!! 未找到 pkg.tar.zst"; exit 1; }
          # cachyos 镜像里的 gh 版本较旧，没有 --clobber：改用 先删后建（幂等）
          if gh release view oplus-connect-latest -R "$repo" >/dev/null 2>&1; then
            gh release delete oplus-connect-latest -R "$repo" --yes --cleanup-tag
          fi
          gh release create oplus-connect-latest -R "$repo" \
            --latest \
            --title "oplus-connect" \
            --notes "BUILD_SHA: $commit
            由 aur-auto-update CI 自动构建（YuKongA/oplus-connect@${commit:0:12}）

            安装: sudo pacman -U $pkg" \
            "$pkg"

          # 步骤摘要：发布成功后给出可复制的安装命令
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## oplus-connect 构建发布" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 上游 commit：\`${commit:0:12}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 包文件：\`$pkg\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 安装：\`sudo pacman -U <release-asset>\`" >> "$GITHUB_STEP_SUMMARY"