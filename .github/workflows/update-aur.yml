name: Update AUR packages

on:
  schedule:
    # 每 6 小时一次（UTC），配合 upstream 发布节奏
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建工具
        run: |
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed base-devel git curl jq python github-cli
          git config --global user.name "Become-ILLUSORY"
          git config --global user.email "becomeillusory@gmail.com"
          echo "makepkg: $(command -v makepkg)"

      - name: 配置 AUR SSH
        run: |
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
          EOF

      - name: 检查并更新所有包
        run: bash update-all.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 汇总
        run: |
          echo "### 本次自动更新完成" >> "$GITHUB_STEP_SUMMARY"