# 上游依赖漂移检测配置
#
# 格式： 包名 | 上游构建定义 URL | [更多 URL...]
#
# 用途：上游改了 depends、但 AUR 上已发布的包没跟进时，这里会报 MISSING。
# 只比对 depends（硬依赖）；makedepends/optdepends 不参与，避免噪音。
#
# 只列「自编译」类包：重打包类（craft / mdm / uu 等）的依赖应由上游产物
# 的 .PKGINFO 决定，不适合用 PKGBUILD 文本比对。
#
# 注意：脚本只做纯文本解析，绝不会 source 这些文件。

# oplus-connect：CI 从上游源码编译，上游 PKGBUILD 在仓库根目录
oplus-connect-private-bin | https://raw.githubusercontent.com/YuKongA/oplus-connect/main/PKGBUILD

# linux-wallpaperengine：自己的 fork 构建，上游也有一份 packaging PKGBUILD，
# 两个都看——fork 可能落后于上游（历史上就漏过 6 个依赖）
linux-wallpaperengine-v3-bin | https://raw.githubusercontent.com/Become-ILLUSORY/linux-wallpaperengine/main/packaging/archlinux/PKGBUILD | https://raw.githubusercontent.com/Almamu/linux-wallpaperengine/main/packaging/archlinux/PKGBUILD
